[project]
name = "gateway"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "notification-shared",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
]

[tool.uv.sources]
notification-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
