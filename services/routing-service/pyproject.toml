[project]
name = "routing-service"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "notification-shared",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "httpx>=0.28.1",
]

[tool.uv.sources]
notification-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
