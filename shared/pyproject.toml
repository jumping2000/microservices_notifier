[project]
name = "notification-shared"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "redis>=8.1.0",
    "httpx>=0.28.1",
    "starlette>=0.49.0",
]

[project.optional-dependencies]
testing = ["pytest>=9.1.1", "testcontainers>=4.15.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
