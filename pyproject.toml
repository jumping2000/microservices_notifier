[project]
name = "notification-platform"
version = "1.0.0"
description = "Universal Notification Platform - microservices demo"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["services/*", "shared"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers>=4.15.0",
    "ruff>=0.16.7",
    "fastapi>=0.141.1",
    "aiosmtpd>=1.4.6",
]
playground = [
    "httpx>=0.28.1",
    "streamlit>=1.64.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# Ruff 0.16 formats Python code blocks inside Markdown. Three of the Markdown
# files in this repository are historical records - the spec, the plan, and the
# original requirements prompt - and rewriting them to satisfy a formatter
# would corrupt the record of what was decided. Excluding Markdown also makes
# `ruff format --check .` mean what the Definition of Done intends: the Python
# sources are clean.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection calls Depends() as an argument default by
# design, which bugbear's B008 flags. Exempting the call is narrower than
# ignoring B008 outright, and it belongs here rather than in each service's
# manifest so there is one copy instead of four.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires Docker (testcontainers)",
    "e2e: requires the full docker compose stack",
]
