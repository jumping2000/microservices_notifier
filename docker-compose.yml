name: notification-platform

services:
  configuration-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
      POSTGRES_DB: configurationdb
    ports: ["5435:5432"]
    volumes: ["configuration-data:/var/lib/postgresql/data"]
    networks: [notification-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d configurationdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  configuration-service:
    build:
      context: .
      dockerfile: services/configuration-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://notif:notif@configuration-db:5432/configurationdb
      SERVICE_NAME: configuration-service
      LOG_LEVEL: INFO
    ports: ["8003:8000"]
    networks: [notification-net]
    restart: on-failure
    depends_on:
      configuration-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    ports: ["6379:6379"]
    networks: [notification-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
      POSTGRES_DB: notificationdb
    ports: ["5433:5432"]
    volumes: ["notification-data:/var/lib/postgresql/data"]
    networks: [notification-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d notificationdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://notif:notif@notification-db:5432/notificationdb
      REDIS_URL: redis://redis:6379/0
      SERVICE_NAME: notification-service
      LOG_LEVEL: INFO
    ports: ["8001:8000"]
    networks: [notification-net]
    restart: on-failure
    depends_on:
      notification-db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  routing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
      POSTGRES_DB: routingdb
    ports: ["5434:5432"]
    volumes: ["routing-data:/var/lib/postgresql/data"]
    networks: [notification-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d routingdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  routing-service:
    build:
      context: .
      dockerfile: services/routing-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://notif:notif@routing-db:5432/routingdb
      REDIS_URL: redis://redis:6379/0
      CONFIGURATION_SERVICE_URL: http://configuration-service:8000
      SERVICE_NAME: routing-service
      LOG_LEVEL: INFO
    ports: ["8002:8000"]
    networks: [notification-net]
    restart: on-failure
    depends_on:
      routing-db: { condition: service_healthy }
      redis: { condition: service_healthy }
      configuration-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  email-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
      POSTGRES_DB: emaildb
    ports: ["5436:5432"]
    volumes: ["email-data:/var/lib/postgresql/data"]
    networks: [notification-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d emaildb"]
      interval: 10s
      timeout: 5s
      retries: 5

  email-service:
    build:
      context: .
      dockerfile: services/email-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://notif:notif@email-db:5432/emaildb
      REDIS_URL: redis://redis:6379/0
      SERVICE_NAME: email-service
      LOG_LEVEL: INFO
      # The e2e tier relies on a delivery slow enough that PROCESSING is
      # reliably observable at a 250ms poll interval.
      DELIVERY_LATENCY_MS_MAX: "2000"
      # Real SMTP only when SMTP_HOST is set in a local .env (see .env.example).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
    ports: ["8004:8000"]
    networks: [notification-net]
    restart: on-failure
    depends_on:
      email-db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  telegram-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
      POSTGRES_DB: telegramdb
    ports: ["5437:5432"]
    volumes: ["telegram-data:/var/lib/postgresql/data"]
    networks: [notification-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d telegramdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  telegram-service:
    build:
      context: .
      dockerfile: services/telegram-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://notif:notif@telegram-db:5432/telegramdb
      REDIS_URL: redis://redis:6379/0
      SERVICE_NAME: telegram-service
      LOG_LEVEL: INFO
      # Same reason as email-service: PROCESSING must be observable in e2e.
      DELIVERY_LATENCY_MS_MAX: "2000"
      # Real Bot API only when set in a local .env (see .env.example).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports: ["8005:8000"]
    networks: [notification-net]
    restart: on-failure
    depends_on:
      telegram-db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      CONFIGURATION_SERVICE_URL: http://configuration-service:8000
      SERVICE_NAME: gateway
      LOG_LEVEL: INFO
    ports: ["8000:8000"]
    networks: [notification-net]
    restart: on-failure
    depends_on:
      notification-service: { condition: service_healthy }
      configuration-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  notification-net:

volumes:
  configuration-data:
  notification-data:
  routing-data:
  email-data:
  telegram-data:
  redis-data:
